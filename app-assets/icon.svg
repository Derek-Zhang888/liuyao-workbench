<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#7a8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>
  <!-- 外方框 -->
  <rect x="176" y="176" width="672" height="672" rx="48" fill="none" stroke="#9aa7ff" stroke-width="34"/>
  <!-- 内薄框 -->
  <rect x="248" y="248" width="528" height="528" rx="16" fill="none" stroke="#9aa7ff" stroke-width="10" opacity="0.4"/>
  <!-- 三横（六爻压缩） -->
  <rect x="300" y="322" width="424" height="34" rx="17" fill="#e8ecff"/>
  <rect x="300" y="495" width="424" height="34" rx="17" fill="#e8ecff"/>
  <rect x="300" y="668" width="424" height="34" rx="17" fill="#e8ecff"/>
  <!-- 中央圆点（太一占） -->
  <circle cx="512" cy="512" r="66" fill="#c9a449"/>
</svg>
