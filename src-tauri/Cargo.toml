[package]
name = "liuyao-workbench"
version = "1.0.0"
description = "六爻工作台：纯前端六爻排盘与卦例管理应用（Web / Windows / Android）"
authors = ["liuyao-workbench"]
license = "MIT"
repository = "https://github.com/liuyao-workbench/liuyao-workbench"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
