[package]
name = "liuyao-workbench"
version = "1.3.1"
description = "六爻工作台：纯前端六爻排盘与卦例管理应用（Web / Windows / Android）"
authors = ["Derek Zhang"]
license = "MIT"
repository = "https://github.com/Derek-Zhang888/liuyao-workbench"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 2026-08-09 关键修复：tauri CLI（tauri build/android build）编译时自动启用 custom-protocol，
# 手动 cargo build 必须显式加 --features custom-protocol，否则 generate_context 走 dev 分支
# （devUrl 存在 → 空资产）→ APK 内不嵌入前端 dist（安卓端曾因此永远旧版/白屏）
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
